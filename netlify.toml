[build]
  command = "npm run build"
  publish = "dist"

# Sunucu API'si: tarayici /sb/... ister, Netlify bunu sunucuya iletir (kullanici tarafinda kurulum gerekmez).
# Sunucu adresi degisince SADECE asagidaki "to" satiri degisir. SPA kuralindan ONCE durmali.
[[redirects]]
  from = "/sb/*"
  to = "https://casa-inexpensive-redeem-aerospace.trycloudflare.com/teklif/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  VITE_SB_YOL = "/sb"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' data:; connect-src 'self' http://localhost:3001 https://sunucu.tail0e7d76.ts.net wss://sunucu.tail0e7d76.ts.net https://api.emailjs.com https://generativelanguage.googleapis.com https://*.supabase.co https://*.firebase.com https://*.firebaseio.com; frame-ancestors 'none';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
